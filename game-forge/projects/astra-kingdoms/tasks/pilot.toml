# Astra Kingdoms task register for Game Forge.
# Generated verbatim from docs/PLAN.md "Pilot and V1 delivery register" (deliverable and acceptance
# text copied exactly). Everything imports as DRAFT; nothing runs until the owner approves it.
#
# Pilot dependencies: the plan says "Dependencies determine order" but does not list them per
# ticket. The depends_on values for tickets 1-10 below are Forge's INFERRED proposal - confirm or
# edit them before approving. V1 tickets 11-82 carry no dependencies yet: the plan only states group
# ordering (73-75 start during the pilot; H begins after the pilot gate and supplies C/D assets).

[defaults]
milestone = "pilot"
permitted_routes = ["claude-api"]
max_attempts = 3
reservation_ceiling_usd = 45

[[tasks]]
