[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-forge"
version = "0.1.0"
description = "Game Forge R1: approved tasks -> isolated candidates -> protected checks -> serial integration, with budgets and evidence"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
claude = ["anthropic>=1.0"]
test = ["pytest>=8"]
catalogue = ["objaverse==0.1.7", "datasets"]   # catalogue lane: Objaverse 1.0 + Objaverse++ tags
intake = ["python-docx>=1.1"]                  # R3: read .docx briefs (Markdown/plain text need nothing)
release = ["cryptography>=42"]                 # R3-R5: Ed25519 approvals/updates, BYOK encryption

[project.scripts]
forge = "forge.cli:main"

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.setuptools.package-data]
"forge.lanes" = ["*.json"]
"forge.installer" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["dotnet: runs the real dotnet SDK (skipped when dotnet is absent)"]
